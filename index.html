
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITFLOW - Move. Progress. Repeat.</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="h-full flex flex-col antialiased">

    <!-- Top Header -->
    <header class="bg-[#FAF8F5]/90 backdrop-blur border-b border-[#E8DEC9] sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
            <h1 class="text-2xl font-bold tracking-wider text-[#3D3323] italic">FITFLOW</h1>
            <span class="text-xs uppercase tracking-widest px-2 py-0.5 bg-[#E8DEC9] text-[#5A4E38] rounded font-semibold hidden sm:inline-block">v1.2</span>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-1.5 bg-[#E8DEC9]/50 border border-[#D9CBA8] px-3 py-1.5 rounded-full text-xs font-medium text-[#5A4E38]">
                <span>🔥</span>
                <span id="header-streak">4 Days</span>
            </div>

            <div class="w-9 h-9 rounded-full bg-[#E8DEC9] border-2 border-[#D9CBA8] overflow-hidden flex items-center justify-center font-serif font-bold text-[#5A4E38] cursor-pointer" onclick="switchTab('profile')">
                T
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-md w-full mx-auto p-4 pb-24 overflow-y-auto">
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#FAF8F5]/95 backdrop-blur border-t border-[#E8DEC9] px-6 py-3 flex justify-between items-center z-40 text-xs text-[#5A4E38]">

        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center space-y-1 text-olive-600 font-semibold transition">
            <span class="text-xl">⌂</span>
            <span>Home</span>
        </button>

        <button onclick="switchTab('workouts')" id="nav-workouts" class="flex flex-col items-center space-y-1 hover:text-olive-600 transition">
            <span class="text-xl">▤</span>
            <span>Workouts</span>
        </button>

        <button onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center space-y-1 hover:text-olive-600 transition">
            <span class="text-xl">▥</span>
            <span>Progress</span>
        </button>

        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center space-y-1 hover:text-olive-600 transition">
            <span class="text-xl">♙</span>
            <span>Profile</span>
        </button>

    </nav>

    <script src="script.js"></script>
</body>
</html>
